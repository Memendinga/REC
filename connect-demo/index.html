<script>
(function(){
const CATS=["Agriculture & élevage","Transformation agroalimentaire","Transport & livraison","Emballage & conditionnement","Commerce & distribution","Import-export","Imprimerie & supports","Marketing & réseaux sociaux","Informatique & sites web","Comptabilité & fiscalité","Juridique & création d'entreprise","Financement & microfinance","BTP & immobilier","Événementiel & location","Restauration & traiteur","Mode & beauté","Formation & coaching","Énergie solaire","Fournitures & équipements","Santé & bien-être"];
const SECTEURS=["Agriculture","Agroalimentaire","Commerce","Services aux entreprises","Transport & logistique","Communication & digital","Finance","BTP & immobilier","Événementiel","Restauration","Mode & beauté","Éducation & formation","Énergie","Santé","Autre"];
const VILLES=["Brazzaville","Pointe-Noire","Dolisie","Oyo","Autre"];
const KEY="rec242connect-demo-v5";
const FORMULES=[["Impulsion",25000,"2 mises en relation par mois"],["Élan",75000,"6 mises en relation par mois, priorité dans les suggestions"],["Expansion",150000,"Mises en relation illimitées et accompagnées par REC 242"]];
const REDUC=20;
/* Filtre : masque numéros, e-mails, liens et pseudos dans tout texte libre */
function mask(s){let m=false;const rep=()=>{m=true;return "[coordonnée masquée]";};let o=String(s||"");
  o=o.replace(/[A-Z0-9._%+-]+\s*(?:@|\(at\)|\barobase\b)\s*[A-Z0-9-]+(?:\s*(?:\.|\bpoint\b)\s*[A-Z0-9-]+)+/gi,rep);
  o=o.replace(/(?:https?:\/\/|www\.|wa\.me\/|chat\.whatsapp\.com)\S*/gi,rep);
  o=o.replace(/@[A-Za-z0-9_.]{3,}/g,rep);
  o=o.replace(/\+?\d[\d\s.\-\/()]{5,}\d/g,x=>x.replace(/\D/g,"").length>=7?rep():x);
  return {text:o,masked:m};}
/* Détection anti-contournement : chiffres, lettres (français, anglais, lingala), découpage en plusieurs messages, e-mails, liens, réseaux */
const NUMW=new Set("zero un une deux trois quatre cinq six sept huit neuf dix onze douze treize quatorze quinze seize vingt vingts trente quarante cinquante soixante septante huitante octante nonante cent cents one two three four five seven eight nine ten moko mibale misato minei mitano motoba sambo nsambo mwambe libwa zomi".split(" "));
function nrm(s){return String(s||"").normalize("NFKC").replace(/[️⃣]/g,"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function digitHit(s){
  const x=nrm(s).replace(/\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/g," date ").replace(/\b\d{1,2}\s*h\s*\d{0,2}\b/g," heure ").replace(/(\d)\s*o(?![a-z])/g,"$10").replace(/(^|[^a-z])o\s*(\d)/g,"$10$2").replace(/(\d)\s*[l|](?![a-z])/g,"$11");
  const re=/\+?\d[\d\s.\-\/()_*]*\d/g;let m;
  while((m=re.exec(x))){const d=m[0].replace(/\D/g,"");const after=x.slice(m.index+m[0].length,m.index+m[0].length+10);
    if(d.length>=8&&!/^\s*(f\b|fcfa|francs?|xaf|kg|tonnes?|t\b|m3|m2|litres?|l\b|ha\b|hectares?|%|poulets|pieces|unites)/.test(after))return true;}
  return false;}
function wordHit(s){const toks=nrm(s).split(/[^a-z0-9]+/).filter(Boolean);let run=0,best=0;
  for(const t of toks){if(NUMW.has(t)||/^\d{1,4}$/.test(t)){run+=/^\d{3,4}$/.test(t)?2:1;best=Math.max(best,run);}else if(t!=="et")run=0;}
  return best>=6;}
function detect(t,prev){const n=nrm(t),types=[];
  if(/[a-z0-9._%+-]+\s*(@|\(at\)|\barobase\b)/.test(n)||/\b(gmail|yahoo|hotmail|outlook|icloud)\b/.test(n))types.push("e-mail");
  if(/(https?:\/\/|www\.|wa\.me|chat\.whatsapp|t\.me\/)/.test(n))types.push("lien");
  if(/(^|\s)@[a-z0-9_.]{3,}/.test(n)||/\b(ajoute|cherche|trouve|ecris|contacte|suis)[- ]?(moi|nous)\b[^.]{0,20}\b(facebook|fb|insta|instagram|tiktok|telegram|whatsapp|snap|messenger)\b/.test(n)||/\b(mon|ma|notre)\s+(compte|page|profil|num|numero|contact)\s+(facebook|fb|insta|instagram|tiktok|telegram|whatsapp|snap)\b/.test(n))types.push("réseau social");
  if(digitHit(t))types.push("numéro en chiffres");
  else if(wordHit(t))types.push("numéro écrit en lettres");
  else if(prev&&prev.length){const all=prev.concat([t]).join(" ");if(digitHit(all)||wordHit(all))types.push("numéro découpé en plusieurs messages");}
  return types;}

    inner=`<h2>Signaler ${esc(v.nom)}</h2><p class="small muted">L'équipe REC 242 examinera le profil. La personne ne saura pas qui l'a signalée.</p>
    <form id="repf" class="section"><label class="f">Motif<select id="rep-m"><option>Profil incomplet ou faux</option><option>Démarchage abusif / spam</option><option>Comportement inapproprié</option><option>Autre</option></select></label>
    <button class="btn danger full" type="submit">Envoyer le signalement</button></form>`;
  }
  return `<div class="sheet-bg" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true"><button class="btn ghost x" data-act="close" aria-label="Fermer">Fermer</button>${inner}</div></div>`;
}

/* ---------- render ---------- */
function render(){
  const app=$("#app");
  const logged=S.admin||(S.me&&me()&&!me().suspendu);
  if(!logged){S.me=null;}
  const u=S.me?me():null;
  let tabs=S.admin?["admin"]:["pour-toi","demandes","moi"];
  if(logged&&!tabs.includes(view))view=tabs[0];
  const labels={"pour-toi":"Pour toi",annuaire:"Annuaire",demandes:"Demandes",moi:"Mon profil",admin:"Tableau de bord"};
  const badges={"pour-toi":u?newOpps().length:0,demandes:u?pendingIn().length:0};
  let body="";
  if(!logged)body=vLogin();
  else body={"pour-toi":vPourToi,demandes:vDemandes,moi:vMoi,admin:vAdmin}[view]();
  app.innerHTML=`
  <header class="top"><div class="wrap"><div><div class="logo">REC 242 <b>Connect</b></div><div class="event">Entreprendre, c'est se connecter</div></div>
  ${logged?`<button class="me" data-act="logout" aria-label="Changer de participant"><span class="av">${esc(S.admin?"A":initials(u.nom))}</span><span>${esc(S.admin?"Admin":u.nom.split(" ")[0])} · changer</span></button>`:""}</div></header>
  <div class="demo"><div class="wrap"><span><b>Prototype de démonstration.</b> Les profils sont des exemples fictifs. ${logged?"Change de participant pour voir l'autre côté.":""}</span></div></div>
  <main><div class="wrap">${body}</div></main>
  ${logged?`<nav class="tabs" aria-label="Navigation"><div class="wrap" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(t=>`<button data-act="go" data-v="${t}" ${view===t?'aria-current="page"':""}>${ICON[t]}${labels[t]}${badges[t]?`<span class="badge">${badges[t]}</span>`:""}</button>`).join("")}</div></nav>`:""}
  ${sheetHTML()}`;
  bindForms();
}

function bindForms(){
  const lg=$("#login");if(lg)lg.onsubmit=e=>{e.preventDefault();login($("#code").value);};
  const fg=$("#fin-gratuit");if(fg)fg.onchange=()=>{if(fg.value){S.finGratuit=fg.value;save();render();toast("Date de fin de la gratuité mise à jour");}};
  document.querySelectorAll("form[data-chat]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const id=f.dataset.chat,inp=$("#chat-"+id),v=inp.value.trim();if(!v)return;const r=S.requests.find(x=>x.id===id);r.msgs=r.msgs||[];
    const authorized=r.status==="autorisee";
    if(!authorized){const prev=r.msgs.filter(m=>m.by===S.me&&Date.now()-m.d<15*60e3).slice(-3).map(m=>m.t);const dt=detect(v,prev);if(dt.length){strike(dt,"message");return;}}
    r.msgs.push({by:S.me,t:v,d:Date.now()});save();render();});
  document.querySelectorAll("select[data-res]").forEach(s=>s.onchange=()=>{const r=S.requests.find(x=>x.id===s.dataset.res);r.resultats=r.resultats||{};if(s.value)r.resultats[S.me]=s.value;else delete r.resultats[S.me];save();toast("Résultat enregistré. Merci !");});
  const pf=$("#pf");if(pf){
    const sync=()=>{draft.nom=$("#p-nom").value.trim();draft.entreprise=$("#p-ent").value.trim();draft.secteur=$("#p-sect").value;draft.ville=$("#p-ville").value;draft.offreTxt=$("#p-otxt").value.trim();draft.besoinTxt=$("#p-btxt").value.trim();draft.tel=$("#p-tel").value.trim();draft.email=$("#p-mail").value.trim();draft.partage={tel:$("#p-stel").checked,email:$("#p-smail").checked};draft.visible=$("#p-vis").checked;draft.charte=$("#p-charte").checked;};
    pf.oninput=sync;pf.onchange=sync;
    pf.querySelectorAll(".picker button").forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.pick,c=b.dataset.cat,arr=draft[k];const i=arr.indexOf(c);if(i>=0)arr.splice(i,1);else{if(arr.length>=4){toast("4 choix maximum");return;}arr.push(c);}b.setAttribute("aria-pressed",i<0);});
    pf.onsubmit=e=>{e.preventDefault();sync();const er=$("#p-err");
      const miss=[];if(!draft.nom)miss.push("nom");if(!draft.entreprise)miss.push("entreprise");if(!draft.offres.length)miss.push("ce que tu proposes");if(!draft.besoins.length)miss.push("ce que tu recherches");if(!draft.tel&&!draft.email)miss.push("un téléphone ou un e-mail");
      if(!draft.charte)miss.push("l'engagement sur les coordonnées");
      if(miss.length){er.textContent="À compléter : "+miss.join(", ")+".";er.hidden=false;return;}
      const dt=detect(draft.offreTxt+" . "+draft.besoinTxt+" . "+draft.entreprise);
      if(dt.length){er.textContent="Tes descriptions contiennent une coordonnée ("+dt.join(", ")+"). Retire-la : tes coordonnées vont uniquement dans les champs prévus, plus bas.";er.hidden=false;return;}
      const i=S.profiles.findIndex(p=>p.id===draft.id);S.profiles[i]=JSON.parse(JSON.stringify(draft));save();toast("Profil enregistré");view="pour-toi";render();};
  }
  const af=$("#askf");if(af)af.onsubmit=e=>{e.preventDefault();sendReq(sheet.id,$("#ask-msg").value.trim());};
  const rf=$("#repf");if(rf)rf.onsubmit=e=>{e.preventDefault();S.reports.push({id:"s"+Date.now(),by:S.me,who:sheet.id,motif:$("#rep-m").value,date:Date.now(),traite:false});save();sheet=null;render();toast("Signalement envoyé à l'équipe");};
  const ac=$("#addcode");if(ac)ac.onsubmit=e=>{e.preventDefault();const c=$("#newcode").value.trim().toUpperCase();if(!c)return;if(S.codes.includes(c)||S.profiles.some(p=>p.code===c)){toast("Ce code existe déjà");return;}S.codes.push(c);save();render();toast("Code ajouté");};
}

function login(raw){
  const c=String(raw||"").trim().toUpperCase();loginErr="";
  if(c==="ADMIN-242"){S.admin=true;S.me=null;view="admin";save();render();return;}
  const p=S.profiles.find(x=>x.code===c);
  if(p){if(p.banni){loginErr="Ce compte a été banni définitivement de REC 242 Connect pour tentative de partage de coordonnées.";render();return;}if(p.suspendu){loginErr="Ce compte est suspendu. L'équipe REC 242 examine ton dossier.";render();return;}S.admin=false;S.me=p.id;view="pour-toi";save();render();return;}
  const k=S.codes.indexOf(c);
  if(k>=0){S.codes.splice(k,1);const id="u"+Date.now();S.profiles.push({id,code:c,nom:"",entreprise:"",secteur:"Autre",offres:[],besoins:[],offreTxt:"",besoinTxt:"",ville:"",tel:"",email:"",partage:{tel:true,email:false},visible:false,exemple:false,suspendu:false,vus:[],pionnier:true,strikes:[]});S.admin=false;S.me=id;view="moi";draft=null;save();render();toast("Bienvenue ! Crée ton profil");return;}
  loginErr=c?"Code inconnu. Vérifie le code reçu après ton inscription.":"Entre ton code d'invitation.";render();
}
function sendReq(to,msg){
  if(activeReq(S.me,to)){toast("Une demande existe déjà avec cette personne");sheet=null;render();return;}
  const pend=S.requests.filter(r=>r.from===S.me&&r.status==="pending").length;
  if(pend>=15){toast("15 demandes en attente maximum. Attends des réponses.");return;}
  // reopen old refused/cancelled pair: allowed once more
  const dt=detect(msg);if(dt.length){strike(dt,"demande");return;}
  S.requests.push({id:"r"+Date.now(),from:S.me,to,msg,status:"pending",date:Date.now(),msgs:[]});save();sheet=null;render();toast("Demande envoyée à "+P(to).nom.split(" ")[0]);
}
function strike(types,ctx){
  const u=me();u.strikes=u.strikes||[];u.strikes.push({d:Date.now(),types,ctx});
  if(u.strikes.length>=2){u.suspendu=true;save();sheet=null;S.me=null;draft=null;loginErr="Ton compte est suspendu : tentative répétée de partager des coordonnées avant l'autorisation de REC 242. L'équipe va examiner ton dossier et peut te bannir définitivement.";render();window.scrollTo(0,0);return;}
  save();sheet={type:"warn",types};render();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act;
  if(a==="close-bg"&&e.target!==t)return;
  switch(a){
    case"go":view=t.dataset.v;if(t.dataset.t)reqTab=t.dataset.t;sheet=null;delConfirm=false;render();window.scrollTo(0,0);break;
    case"rtab":reqTab=t.dataset.t;render();break;
    case"profile":sheet={type:"profile",id:t.dataset.id};render();break;
    case"ask":sheet={type:"ask",id:t.dataset.id};render();setTimeout(()=>{const m=$("#ask-msg");if(m)m.focus();},50);break;
    case"report":sheet={type:"report",id:t.dataset.id};render();break;
    case"block":S.blocks.push({by:S.me,who:t.dataset.id});S.requests.forEach(r=>{if(((r.from===S.me&&r.to===t.dataset.id)||(r.to===S.me&&r.from===t.dataset.id))&&r.status==="pending")r.status="cancelled";});save();sheet=null;render();toast("Profil bloqué. Vous ne vous verrez plus.");break;
    case"close":case"close-bg":sheet=null;render();break;
    case"accept":case"refuse":case"cancel":{const r=S.requests.find(x=>x.id===t.dataset.id);r.status={accept:"attente",refuse:"refused",cancel:"cancelled"}[a];if(a==="accept")r.acceptedAt=Date.now();save();if(a==="accept"){reqTab="echanges";}render();toast({accept:"Accord enregistré. Vous pouvez échanger ; REC 242 autorisera la mise en relation.",refuse:"Demande refusée",cancel:"Demande annulée"}[a]);break;}
    case"authorize":case"reject":{const r=S.requests.find(x=>x.id===t.dataset.id);r.status=a==="authorize"?"autorisee":"rejetee";r.authAt=Date.now();save();render();toast(a==="authorize"?"Mise en relation autorisée : coordonnées transmises":"Mise en relation non autorisée");break;}
    case"ban":{const p=P(t.dataset.id);p.banni=true;p.suspendu=true;p.visible=false;S.requests.forEach(r=>{if((r.from===p.id||r.to===p.id)&&["pending","attente"].includes(r.status))r.status="rejetee";});save();render();toast(p.nom.split(" ")[0]+" est banni de REC 242 Connect");break;}
    case"unsusp":{const p=P(t.dataset.id);p.suspendu=false;p.strikes=[];save();render();toast("Suspension levée");break;}
    case"adherer":sheet={type:"adh"};render();break;
    case"adh-ok":{const u=me();u.adherent=t.dataset.f;save();sheet=null;render();toast("Bienvenue parmi les adhérents "+t.dataset.f+" !");break;}
    case"sim":S.simul2027=!S.simul2027;save();render();toast(S.simul2027?"Simulation : après le 31 décembre 2026":"Retour à la phase Pionniers");break;
    case"phase":S.phase=S.phase==="evenement"?"apres":"evenement";save();render();break;
    case"logout":S.me=null;S.admin=false;loginErr="";sheet=null;draft=null;save();render();window.scrollTo(0,0);break;
    case"code":login(t.dataset.c);window.scrollTo(0,0);break;
    case"del":delConfirm=true;render();break;
    case"del-no":delConfirm=false;render();break;
    case"del-yes":{const id=S.me;S.profiles=S.profiles.filter(p=>p.id!==id);S.requests=S.requests.filter(r=>r.from!==id&&r.to!==id);S.me=null;delConfirm=false;draft=null;save();render();toast("Profil supprimé");break;}
    case"suspend":{const p=P(t.dataset.id);p.suspendu=true;const s=S.reports.find(x=>x.id===t.dataset.s);if(s)s.traite=true;save();render();toast("Compte suspendu");break;}
    case"close-rep":{const s=S.reports.find(x=>x.id===t.dataset.s);s.traite=true;save();render();toast("Signalement classé");break;}
    case"toggle-susp":{const p=P(t.dataset.id);p.suspendu=!p.suspendu;save();render();break;}
    case"reset":S=seed();S.admin=true;S.me=null;save();render();toast("Démo réinitialisée");break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet){sheet=null;render();}});
render();
})();
</script>
</body></html>
